services:
  - type: web
    name: video-downloader-backend
    env: node
    buildCommand: "apt-get update && apt-get install -y ffmpeg python3-pip && pip3 install --break-system-packages -U yt-dlp && npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
